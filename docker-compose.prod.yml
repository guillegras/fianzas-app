name: finanzas-prod

services:
  db:
    container_name: finanzas-prod-db
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-finanzas_db}
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
    networks:
      - prod_net

  backend:
    container_name: finanzas-prod-backend
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME:-finanzas_db}
      DB_PORT: 5432
      DB_HOST: db
      CORS_ORIGINS: http://localhost:8080,http://127.0.0.1:8080
    depends_on:
      - db
    networks:
      - prod_net

  frontend:
    container_name: finanzas-prod-frontend
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      - backend
    networks:
      - prod_net

volumes:
  pgdata_prod:

networks:
  prod_net:
    driver: bridge