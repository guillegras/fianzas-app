name: finanzas-dev

services:
  db:
    container_name: finanzas-dev-db
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: dev_user
      POSTGRES_PASSWORD: dev_password
      POSTGRES_DB: finanzas_db_dev
    ports:
      - "${DEV_DB_PORT:-5433}:5432"
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
    networks:
      - dev_net

  backend:
    container_name: finanzas-dev-backend
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      DB_USER: dev_user
      DB_PASSWORD: dev_password
      DB_NAME: finanzas_db_dev
      DB_PORT: 5432
      DB_HOST: db
      PYTHONPATH: /app/src
      CORS_ORIGINS: http://localhost:${DEV_FRONTEND_PORT:-5173},http://127.0.0.1:${DEV_FRONTEND_PORT:-5173}
    ports:
      - "${DEV_BACKEND_PORT:-8001}:8000"
    volumes:
      - ./backend:/app
    command: uvicorn finanzas_api.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      - db
    networks:
      - dev_net

  frontend:
    container_name: finanzas-dev-frontend
    image: node:20-alpine
    restart: unless-stopped
    working_dir: /app
    environment:
      VITE_API_URL: http://localhost:${DEV_BACKEND_PORT:-8001}
    volumes:
      - ./frontend:/app
      - node_modules_dev:/app/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "${DEV_FRONTEND_PORT:-5173}:5173"
    depends_on:
      - backend
    networks:
      - dev_net
    stdin_open: true
    tty: true

volumes:
  pgdata_dev:
  node_modules_dev:

networks:
  dev_net:
    driver: bridge