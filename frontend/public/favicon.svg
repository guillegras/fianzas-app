<svg xmlns="http://www.w3.org/2000/svg" width="48" height="46" viewBox="0 0 48 46">
  <defs>
    <linearGradient id="tendencia" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
  </defs>
  
  <!-- Fondo adaptado exactamente a 48x46 con radio de borde proporcional -->
  <rect width="48" height="46" rx="10" fill="#0f172a" />
  
  <!-- Línea de tendencia escalada a las nuevas dimensiones -->
  <path d="M10 33 L 20 21 L 27 26 L 38 12" 
        stroke="url(#tendencia)" 
        stroke-width="5" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        fill="none" />
        
  <!-- Punto culminante ajustado -->
  <circle cx="38" cy="12" r="2.5" fill="#10b981" />
</svg>
